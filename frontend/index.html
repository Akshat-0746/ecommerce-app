<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">ShopEasy</a>
    </header>

    <main class="container">
        <h1>Our Products</h1>

        <form id="filter-form" class="filters">
            <input type="search" id="search" placeholder="Search products..." maxlength="100">

            <select id="category">
                <option value="">All categories</option>
            </select>

            <input type="number" id="min-price" placeholder="Min price" min="0" step="0.01">
            <input type="number" id="max-price" placeholder="Max price" min="0" step="0.01">

            <button type="submit">Apply</button>
            <button type="reset">Clear</button>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
        <div id="product-grid" class="grid"></div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/list.js"></script>
</body>
</html>
